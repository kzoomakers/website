# One pipeline: tests (+ deps audit), the image build, and the asset sync run in parallel; deploy runs only if all pass.
# Required status checks (branch ruleset): test, audit, image. `audit` is a stub that mirrors `test` (the audit steps live in `test` to share one npm ci).
name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 12 * * 5" # weekly (Fridays): new CVEs land without any push; this is also when the Trivy image scan runs
  workflow_dispatch: # Actions > CI > Run workflow > pick a branch: same gates, then deploys that branch 

# New push to a PR cancels its stale run. Never cancel on main: a half-finished deploy is worse than a queued one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  FLY_APP: kzoomakers-org-website
  IMAGE: registry.fly.io/kzoomakers-org-website:${{ github.sha }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres: # the feed DB tests (tests/feed-*-db.test.mjs) skip without TEST_DATABASE_URL
        image: postgres:16
        env: { POSTGRES_PASSWORD: test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    permissions:
      contents: read
      pull-requests: write # CTRF PR comment
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --ignore-scripts
      - name: Validate JSON files
        working-directory: .
        run: git ls-files '*.json' | xargs -n1 node -e 'JSON.parse(require("fs").readFileSync(process.argv[1]))'
      - name: Unit tests + coverage
        env:
          TEST_DATABASE_URL: postgres://postgres:test@localhost:5432/postgres
        run: |
          mkdir -p ctrf
          node --import ./tests/resolve.mjs --test --experimental-test-coverage \
            --test-reporter=spec --test-reporter-destination=stdout \
            --test-reporter=spec --test-reporter-destination=spec.txt \
            --test-reporter=junit --test-reporter-destination=junit.xml
      - name: Convert to CTRF
        if: always()
        run: '[ -f junit.xml ] && npx --yes junit-to-ctrf junit.xml -o ctrf/ctrf-report.json || true'
      - name: Coverage table in job summary
        if: always()
        run: |
          { echo '### Coverage'; echo '```'; sed -n '/start of coverage report/,/end of coverage report/p' spec.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: CTRF report (summary + PR comment)
        if: always() && hashFiles('web/ctrf/ctrf-report.json') != ''
        uses: ctrf-io/github-test-reporter@v1
        with:
          report-path: web/ctrf/ctrf-report.json
          summary-report: true
          pull-request-report: true
          previous-results-report: true
          flaky-report: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true # fork PRs get a read-only token; the test step itself is the gate
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results
          path: |
            web/ctrf/
            web/junit.xml
            web/spec.txt
          retention-days: 30
      # Last, so a new advisory can't stop the tests from running and reporting.
      - name: npm audit
        run: |
          set +e
          npm audit --audit-level=low | tee audit.txt
          code=${PIPESTATUS[0]}
          { echo '### npm audit'; echo '```'; cat audit.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $code
      # One retry: the registry's signing-key fetch fails now and then (EMISSINGSIGNATUREKEY on a package that verifies fine a minute later). A real bad signature fails both tries.
      - run: npm audit signatures || { sleep 20; npm audit signatures; }

  audit: # required check name kept; the real audit runs inside `test`
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - run: echo "npm audit ran in the test job"

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build (layer cache shared across runs)
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=min # min: exporting every intermediate layer took ~3.5 min and the app layers change on every commit anyway
      - name: Trivy scan (HIGH/CRITICAL with a fix available fails the job; Fridays and manual runs only)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
          trivyignores: .trivyignore.yaml
      # Push the image that was just built (and scanned, on Fridays/manual runs); deploy ships exactly this.
      - if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: superfly/flyctl-actions/setup-flyctl@master
      - if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: flyctl auth docker && docker push "$IMAGE"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  # web/public/images and web/public/download are kept in git but left out of the Docker image (.dockerignore); the app serves them from the
  # public Tigris bucket kzoomakers-public-assets (next.config.mjs fallback rewrite keeps the URLs). Deploy waits for this, so the new image never runs before its files are there.
  assets:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.ASSETS_S3_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.ASSETS_S3_SECRET_KEY }}
      AWS_DEFAULT_REGION: ${{ secrets.ASSETS_S3_REGION || 'auto' }}
      ENDPOINT: ${{ secrets.ASSETS_S3_ENDPOINT }}
      BUCKET: ${{ secrets.ASSETS_S3_BUCKET }}
    steps:
      - uses: actions/checkout@v7
      - name: Check secrets
        run: '[ -n "$ENDPOINT" ] && [ -n "$BUCKET" ] && [ -n "$AWS_ACCESS_KEY_ID" ] && [ -n "$AWS_SECRET_ACCESS_KEY" ] || { echo "::error::Add repo secrets ASSETS_S3_ENDPOINT, ASSETS_S3_BUCKET, ASSETS_S3_ACCESS_KEY, ASSETS_S3_SECRET_KEY (optional ASSETS_S3_REGION)"; exit 1; }'
      - name: Sync images and downloads to the bucket
        run: |
          for d in images download; do
            aws s3 sync "web/public/$d" "s3://$BUCKET/$d" --endpoint-url "$ENDPOINT" --delete --size-only --only-show-errors --cache-control "public, max-age=86400"
          done

  deploy:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' # push only triggers on main
    needs: [test, audit, image, assets]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    concurrency: { group: deploy, cancel-in-progress: false }
    steps:
      - uses: actions/checkout@v7 # fly.toml
      - uses: superfly/flyctl-actions/setup-flyctl@master
      # Rolling deploy gated by the fly.toml health check: a bad release never replaces the running machine.
      - run: flyctl deploy --image "$IMAGE" --app "$FLY_APP"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
